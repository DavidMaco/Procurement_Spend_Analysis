# ═══════════════════════════════════════════════════════════════════════════
# Procurement Intelligence SaaS — CI/CD Pipeline
# ═══════════════════════════════════════════════════════════════════════════
# Triggers: push to main (deploy) or PR (test only)
# Stages: lint → test → security-scan → build → deploy
# ═══════════════════════════════════════════════════════════════════════════

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: procurement-intelligence/api
  ECS_CLUSTER: procurement-intelligence-production
  ECS_SERVICE: procurement-intelligence-api

jobs:
  # ─────────────────────────────────────────────────────
  # Stage 0: Standards Governance
  # ─────────────────────────────────────────────────────
  standards-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify standards baseline files exist
        run: |
          required_files=(
            ".github/copilot-instructions.md"
            ".github/instructions/api-ops.instructions.md"
            ".github/instructions/frontend-quality.instructions.md"
            ".github/instructions/execution-workflow.instructions.md"
            ".github/instructions/security.instructions.md"
            ".github/instructions/documentation.instructions.md"
            ".github/skills/plan-execute-verify/SKILL.md"
            ".github/skills/standards-review/SKILL.md"
            "AGENTS.md"
            "docs/STANDARDS_IMPLEMENTATION.md"
            "docs/SKILLS_IMPLEMENTATION.md"
            "docs/ROLLOUT_IMPLEMENTATION.md"
          )

          missing=0
          for path in "${required_files[@]}"; do
            if [ ! -f "$path" ]; then
              echo "Missing required standards file: $path"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Security pattern scan
        run: |
          python - <<'EOF'
          import re
          import sys
          from pathlib import Path

          PATTERNS = [
              (
                  re.compile(
                      r'os\.environ\.get\s*\([^)]+,\s*["\'][^"\']{0,6}'
                      r'(secret|password|token|key|dev-|change-me|placeholder)'
                      r'[^"\']*["\'\)]',
                      re.I,
                  ),
                  "Hardcoded fallback for secret env var in os.environ.get()",
              ),
              (
                  re.compile(
                      r'raise\s+HTTPException\b[^\n]*\bdetail\s*=\s*str\s*\(\s*exc\s*\)'
                  ),
                  "Raw exception text exposed via HTTPException detail=str(exc)",
              ),
          ]

          EXCLUDE_DIRS = {".venv", "venv", "node_modules", ".git", "__pycache__"}

          errors = []
          for py_file in Path(".").rglob("*.py"):
              if any(p in py_file.parts for p in EXCLUDE_DIRS):
                  continue
              text = py_file.read_text(errors="ignore")
              for pattern, msg in PATTERNS:
                  for match in pattern.finditer(text):
                      line_no = text[: match.start()].count("\n") + 1
                      errors.append(f"{py_file}:{line_no}: {msg}")

          if errors:
              print("SECURITY PATTERN SCAN — FAIL")
              for e in errors:
                  print(f"  {e}")
              sys.exit(1)
          print("Security pattern scan: OK")
          EOF

      - name: Markdown lint standards files
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            AGENTS.md
            .github/copilot-instructions.md
            .github/instructions/**/*.md
            .github/skills/**/SKILL.md
            docs/STANDARDS_IMPLEMENTATION.md
            docs/SKILLS_IMPLEMENTATION.md
            docs/ROLLOUT_IMPLEMENTATION.md

  # ─────────────────────────────────────────────────────
  # Stage 1: Lint & Type Check
  # ─────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    needs: standards-governance
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  # ─────────────────────────────────────────────────────
  # Stage 2: Test (unit + pipeline smoke)
  # ─────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pipeline smoke test
        run: |
          python generate_data.py
          python create_db.py
          python analyze_procurement.py

      - name: Validate generated files
        run: |
          test -f procurement.db
          test -f procurement_insights.json
          test -f supplier_optimization_recommendations.csv
          test -f constrained_supplier_recommendations.csv
          test -f monte_carlo_uncertainty_bounds.csv

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=src/procurement_spend_analysis \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -x -q

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procurement-pipeline-artifacts
          path: |
            procurement_insights.json
            procurement_insights_summary.csv
            category_spend.csv
            supplier_performance.csv
            price_variance_top20.csv
            monthly_spend_by_category.csv
            supplier_optimization_recommendations.csv
            constrained_supplier_recommendations.csv
            savings_scenarios.csv
            monte_carlo_uncertainty_bounds.csv
            EXECUTIVE_REPORT.md
            EXECUTIVE_REPORT_ONE_PAGE.html
            EXECUTIVE_REPORT_ONE_PAGE.pdf
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────
  # Stage 3: Security Scan
  # ─────────────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]" safety bandit

      - name: Bandit security scan
        run: bandit -r src/ -c pyproject.toml -f json -o bandit-report.json || true

      - name: Safety dependency audit
        run: safety check --output json > safety-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  # ─────────────────────────────────────────────────────
  # Stage 4: Build & Push Container
  # ─────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets['AWS_DEPLOY_ROLE_ARN'] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & tag image
        id: meta
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_TAG="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA::8}"
          docker build -f Dockerfile.production -t "$IMAGE_TAG" .
          echo "tags=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Push to ECR
        run: docker push ${{ steps.meta.outputs.tags }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

  # ─────────────────────────────────────────────────────
  # Stage 5: Deploy to production
  # ─────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets['AWS_DEPLOY_ROLE_ARN'] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Smoke test
        run: |
          API_URL="https://api.procurementintelligence.io"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/health")
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi
          echo "Deployment verified — health check passed"
